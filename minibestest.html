<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-BESTest 評価</title>
  <style>
    :root { --bg:#f5f7f8; --card:#fff; --text:#172026; --muted:#627078; --line:#d7e0e3; --accent:#176b63; --soft:#eaf4f2; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px 16px 110px; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }
    main { width:min(900px,100%); margin:0 auto; }
    h1 { margin:0 0 6px; font-size:22px; }
    h2 { margin:0 0 10px; color:#174b46; font-size:17px; }
    p { color:var(--muted); font-size:13px; line-height:1.65; }
    .card { margin:12px 0; padding:16px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .summary { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
    .summary div { padding:10px 5px; border:1px solid var(--line); border-radius:6px; background:var(--soft); text-align:center; font-size:11px; }
    .summary strong { display:block; margin-top:4px; color:var(--accent); font-size:20px; }
    .item { padding:13px 0; border-bottom:1px solid var(--line); }
    .item:last-child { border-bottom:0; }
    .title { font-weight:900; }
    .method { margin:4px 0 9px; color:var(--muted); font-size:12px; line-height:1.55; }
    .scores { display:flex; gap:7px; }
    .scores label { flex:1; }
    .scores input { position:absolute; opacity:0; }
    .scores span { display:block; padding:9px; border:1px solid #b7c3c7; border-radius:6px; text-align:center; cursor:pointer; font-weight:800; }
    .scores input:checked + span { color:#fff; border-color:var(--accent); background:var(--accent); }
    details { margin-top:8px; }
    summary { cursor:pointer; color:var(--accent); font-size:12px; font-weight:800; }
    ul { margin:7px 0 0; padding-left:20px; color:var(--muted); font-size:12px; line-height:1.65; }
    .footer { position:fixed; left:0; right:0; bottom:0; padding:10px 16px; border-top:1px solid var(--line); background:rgba(255,255,255,.96); }
    .actions { width:min(900px,100%); margin:0 auto; display:flex; flex-wrap:wrap; gap:8px; }
    button,a.button { flex:1; min-width:150px; padding:12px; border:1px solid var(--accent); border-radius:6px; color:#fff; background:var(--accent); font-weight:800; text-align:center; text-decoration:none; cursor:pointer; }
    a.button { color:var(--text); border-color:var(--line); background:#fff; }
    @media(max-width:700px){ .summary{grid-template-columns:repeat(2,1fr);} }
  </style>
</head>
<body>
<main>
  <h1>Mini-BESTest 評価</h1>
  <p>14項目を各0〜2点で評価します。左右差がある項目は低い方の点数を採用してください。</p>
  <section class="card">
    <div class="summary">
      <div>予測的<strong id="sec1">0 / 6</strong></div>
      <div>反応的<strong id="sec2">0 / 6</strong></div>
      <div>感覚<strong id="sec3">0 / 6</strong></div>
      <div>動的歩行<strong id="sec4">0 / 10</strong></div>
      <div>合計<strong id="total">0 / 28</strong></div>
    </div>
    <p id="interpretation">脳卒中慢性期の転倒リスク参考値：14点以下。MDC：4点。</p>
  </section>
  <div id="sections"></div>
</main>

<div class="footer">
  <div class="actions">
    <a class="button" href="./index.html">アプリ一覧</a>
    <button id="reset" type="button">リセット</button>
    <button id="keyform" type="button">KeyFormで確認</button>
    <button id="send" type="button">脳卒中評価記録へ送る</button>
  </div>
</div>

<script>
const EVAL_DRAFT_KEY = "rehacalc_stroke_draft_v1";
const KEYFORM_TRANSFER_KEY = "rehacalc_keyform_transfer_v1";
let assessmentId = `mini_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
const SECTIONS = [
  {
    id:"sec1", title:"セクション1：予測的姿勢調整", max:6,
    items:[
      ["座位から立位","手を使わずに立ち上がる",["介助なしでは立てない","手を使えば立てる、または複数回試みる","手を使わず素早く立てる"]],
      ["つま先立ち","できるだけ高く3秒保持",["3秒未満","不安定だが3秒保持","安定して3秒保持"]],
      ["片脚立位","腕組みで左右を計測し低い方を採用",["10秒未満","10〜19秒","20秒以上"]]
    ]
  },
  {
    id:"sec2", title:"セクション2：反応的姿勢制御", max:6,
    items:[
      ["前方ステッピング","胸骨を前方へ素早く押す",["ステップ不可・介助必要","複数ステップで回復","1歩で自立回復"]],
      ["後方ステッピング","肩甲骨を後方へ素早く引く",["ステップ不可・介助必要","複数ステップで回復","1歩で自立回復"]],
      ["側方ステッピング","左右を評価し低い方を採用",["ステップ不可・介助必要","複数ステップで回復","1歩で自立回復"]]
    ]
  },
  {
    id:"sec3", title:"セクション3：感覚の方向づけ", max:6,
    items:[
      ["開眼・硬い床","足を揃え、腕組み、開眼で30秒",["30秒未満","30秒保持・軽度の揺れ","30秒安全に保持"]],
      ["閉眼・フォームパッド","フォーム上、腕組み、閉眼で30秒",["30秒未満","30秒保持・中等度の揺れ","30秒安全に保持"]],
      ["傾斜面・閉眼","傾斜板上、腕組み、閉眼で30秒",["30秒未満","30秒保持・揺れや調整あり","30秒安全に保持"]]
    ]
  },
  {
    id:"sec4", title:"セクション4：動的歩行", max:10,
    items:[
      ["歩行速度変化","普通、急いで、普通の速度変化",["速度変化不可・著明な不安定","速度変化するがふらつく","明確な速度変化・安全"]],
      ["頭部水平回旋歩行","歩きながら左右交互に頭を振る",["歩行停止・著明な不安定","速度低下・軽度ふらつき","スムーズで安全"]],
      ["ピボットターン","3歩後に素早く180度方向転換",["バランスを崩す・介助必要","3秒超だが安全","3秒以内で安全"]],
      ["障害物越え歩行","15cm障害物を越える",["越えられない・転倒様","ためらい・速度低下・ふらつき","安全に越える"]],
      ["TUG二重課題","3m TUGと100から3ずつ引き算",["安全に完了できない","二重課題で速度低下・ためらい","安全完了・歩行変化なし"]]
    ]
  }
];

function render() {
  let itemNumber = 0;
  document.getElementById("sections").innerHTML = SECTIONS.map(section => `
    <section class="card">
      <h2>${section.title}</h2>
      ${section.items.map(item => {
        itemNumber += 1;
        const current = itemNumber;
        return `<article class="item">
          <div class="title">${current}. ${item[0]}</div>
          <div class="method">${item[1]}</div>
          <div class="scores">${[0,1,2].map(score => `<label><input type="radio" name="item${current}" value="${score}"><span>${score}点</span></label>`).join("")}</div>
          <details><summary>採点基準</summary><ul>${item[2].map((text, score) => `<li>${score}点：${text}</li>`).join("")}</ul></details>
        </article>`;
      }).join("")}
    </section>`).join("");
  document.querySelectorAll('input[type="radio"]').forEach(input => input.addEventListener("change", calculate));
}

function calculate() {
  let index = 0;
  let total = 0;
  SECTIONS.forEach(section => {
    let sectionTotal = 0;
    section.items.forEach(() => {
      index += 1;
      const checked = document.querySelector(`input[name="item${index}"]:checked`);
      sectionTotal += checked ? Number(checked.value) : 0;
    });
    total += sectionTotal;
    document.getElementById(section.id).textContent = `${sectionTotal} / ${section.max}`;
  });
  document.getElementById("total").textContent = `${total} / 28`;
}

function buildMiniDetail() {
  let index = 0;
  const items = [];
  SECTIONS.forEach(section => {
    section.items.forEach(item => {
      index += 1;
      const checked = document.querySelector(`input[name="item${index}"]:checked`);
      items.push({
        id:index,
        name:item[0],
        section:section.title.replace(/^セクション\d+：/, ""),
        score:checked ? Number(checked.value) : null,
        max:2
      });
    });
  });
  return {
    assessmentId,
    assessmentKey:"miniBestest",
    scaleKey:"mini_stroke",
    population:"stroke",
    total:items.reduce((sum, item) => sum + (item.score ?? 0), 0),
    max:28,
    items,
    updatedAt:new Date().toISOString()
  };
}

function requireCompleteDetail() {
  const detail = buildMiniDetail();
  if (detail.items.some(item => item.score === null)) {
    alert("14項目すべてを入力してください。");
    return null;
  }
  return detail;
}

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Mini-BESTestの入力をリセットしますか？")) return;
  document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
  assessmentId = `mini_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  calculate();
});

document.getElementById("send").addEventListener("click", () => {
  const detail = requireCompleteDetail();
  if (!detail) return;
  localStorage.setItem(EVAL_DRAFT_KEY, JSON.stringify({
    sourceLabel:"Mini-BESTest",
    recordDate:new Date().toISOString().slice(0, 10),
    measurements:{ miniBestest:String(detail.total) },
    assessmentDetails:{ miniBestest:detail }
  }));
  location.href = "./stroke-record.html";
});

document.getElementById("keyform").addEventListener("click", () => {
  const detail = requireCompleteDetail();
  if (!detail) return;
  localStorage.setItem(KEYFORM_TRANSFER_KEY, JSON.stringify({
    source:"assessment",
    sourceLabel:"Mini-BESTest",
    recordDate:new Date().toISOString().slice(0, 10),
    detail
  }));
  location.href = "./keyform.html";
});

render();
calculate();
</script>
<script src="./assessment-context.js?v=20260701-tug-v80" data-record-target="stroke"></script>
</body>
</html>
