<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
  <title>HDS-R・MMSE 共通シート</title>
  <script src="./assets/pdf-lib.min.js"></script>
  <style>
    :root {
      --primary:#0f766e;
      --bg:#f2f2f7;
      --card:#fff;
      --text:#1c1c1e;
      --muted:#6b7280;
      --line:#e5e7eb;
      --soft:#f0fdfa;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      padding:10px;
      padding-bottom:28px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    header {
      max-width:1080px;
      margin:0 auto 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    h1 { margin:6px 0 0; font-size:18px; }
    .back {
      color:#111;
      text-decoration:none;
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
      white-space:nowrap;
    }
    main {
      max-width:1080px;
      margin:0 auto;
      display:grid;
      gap:12px;
    }
    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      box-shadow:0 1px 4px rgba(0,0,0,.08);
    }
    h2 {
      font-size:15px;
      border-left:4px solid var(--primary);
      padding-left:8px;
      margin:0 0 12px;
      color:var(--primary);
    }
    .score-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:10px;
    }
    .score-box {
      border:1px solid var(--line);
      border-radius:12px;
      background:#fafafa;
      padding:12px;
      text-align:center;
    }
    .score-box span {
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-bottom:5px;
    }
    .score-box strong {
      color:var(--primary);
      font-size:36px;
      line-height:1;
    }
    .note {
      color:var(--muted);
      font-size:12px;
      line-height:1.65;
      margin:8px 0;
    }
    .sheet-wrap {
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
    }
    table {
      width:100%;
      min-width:760px;
      border-collapse:collapse;
      font-size:13px;
    }
    th, td {
      border-bottom:1px solid var(--line);
      border-right:1px solid var(--line);
      padding:8px;
      vertical-align:middle;
    }
    th:last-child, td:last-child { border-right:0; }
    tr:last-child td { border-bottom:0; }
    th {
      background:#f3f4f6;
      color:#374151;
      font-size:12px;
      text-align:center;
    }
    .no {
      width:42px;
      text-align:center;
      color:#374151;
      font-weight:800;
    }
    .question {
      line-height:1.45;
    }
    .hint {
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
    }
    .score-select {
      width:88px;
      padding:9px 10px;
      border:1px solid #d1d5db;
      border-radius:9px;
      background:#fff;
      font-size:16px;
      text-align:center;
    }
    .disabled-cell {
      color:#9ca3af;
      text-align:center;
      background:#fafafa;
    }
    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }
    button {
      appearance:none;
      border:0;
      border-radius:11px;
      padding:12px 14px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      color:#fff;
      background:var(--primary);
    }
    button.secondary {
      color:#111;
      background:#f3f4f6;
      border:1px solid var(--line);
    }
  </style>
</head>
<body>
  <header>
    <h1>HDS-R・MMSE 共通シート</h1>
    <a class="back" href="./index.html">一覧へ</a>
  </header>

  <main>
    <section class="card">
      <h2>採点</h2>
      <div class="score-grid">
        <div class="score-box">
          <span>HDS-R</span>
          <strong id="hdsrTotal">0</strong>
          / 30
        </div>
        <div class="score-box">
          <span>MMSE</span>
          <strong id="mmseTotal">0</strong>
          / 30
        </div>
      </div>
      <p class="note">各項目の得点を選択してください。評価記録へ送信するデータはMMSE合計点のみです。PDFにはHDS-RとMMSEの合計点を転記します。</p>

      <div class="sheet-wrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>質問内容</th>
              <th>HDS-R</th>
              <th>MMSE</th>
            </tr>
          </thead>
          <tbody id="scoreRows"></tbody>
        </table>
      </div>

      <div class="actions">
        <button id="sendRecord" type="button">MMSEを評価記録へ送る</button>
        <button id="createPdf" type="button">HDS-R・MMSE用紙PDFを作成</button>
        <button id="clearScores" type="button" class="secondary">クリア</button>
      </div>
    </section>
  </main>

<script>
const EVAL_DRAFT_KEY = "rehacalc_record_transfer_v1";
const MMSE_TEMPLATE_URL = "./assets/hdsr-mmse-sheet.pdf";
const STATE_KEY = "rehacalc_hdsr_mmse_scores_v1";

const ROWS = [
  { no:1, text:"お歳はいくつですか？", hint:"2年までの誤差は正解", hdsr:1 },
  { no:2, text:"今日は何年・何月・何日・何曜日ですか？", hint:"HDS-Rは年/月/日/曜日の4点、MMSEは年/季節/月/日/曜日の5点", hdsr:4, mmse:5 },
  { no:3, text:"ここはどこですか？", hint:"HDS-Rは自発的回答2点、ヒント後正解1点。MMSEは都道府県/市/病院/階/地方の5点", hdsr:2, mmse:5 },
  { no:4, text:"3つの言葉を覚えてください", hint:"即時記銘。各1点", hdsr:3, mmse:3 },
  { no:5, text:"計算・注意", hint:"HDS-Rは100から7を引く課題、MMSEは連続計算または逆唱", hdsr:2, mmse:5 },
  { no:6, text:"数字の逆唱", hint:"例: 6-8-2、3-5-2-9", hdsr:2 },
  { no:7, text:"先ほど覚えてもらった言葉をもう一度言ってください", hint:"HDS-Rはヒントあり各2点、MMSEは各1点", hdsr:6, mmse:3 },
  { no:8, text:"5つの物品を見せ、それを隠して何があったか答える", hint:"HDS-Rのみ。5個で5点", hdsr:5 },
  { no:9, text:"知っている野菜の名前をできるだけ多く言ってください", hint:"HDS-Rのみ。10個で5点", hdsr:5 },
  { no:10, text:"物品呼称", hint:"時計・鉛筆など。MMSEのみ", mmse:2 },
  { no:11, text:"文の復唱", hint:"みんなで力を合わせて綱を引きます。MMSEのみ", mmse:1 },
  { no:12, text:"3段階命令", hint:"紙を取る、半分に折る、机に置く。MMSEのみ", mmse:3 },
  { no:13, text:"読字命令", hint:"文章を読んで、その指示に従う。MMSEのみ", mmse:1 },
  { no:14, text:"書字命令", hint:"自発的で意味のある文を書く。MMSEのみ", mmse:1 },
  { no:15, text:"図形模写", hint:"重なった五角形を模写する。MMSEのみ", mmse:1 }
];

const $ = (id) => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);

function scoreOptions(max, value) {
  let html = `<option value="">-</option>`;
  for (let i = 0; i <= max; i++) {
    html += `<option value="${i}"${String(i) === String(value) ? " selected" : ""}>${i}</option>`;
  }
  return html;
}

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STATE_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveState() {
  const state = {};
  document.querySelectorAll(".score-select").forEach((select) => {
    state[select.dataset.key] = select.value;
  });
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function renderRows() {
  const state = loadState();
  $("scoreRows").innerHTML = ROWS.map((row) => `
    <tr>
      <td class="no">${row.no}</td>
      <td class="question">${row.text}<span class="hint">${row.hint}</span></td>
      <td>${row.hdsr ? `<select class="score-select" data-scale="hdsr" data-key="hdsr_${row.no}">${scoreOptions(row.hdsr, state[`hdsr_${row.no}`])}</select>` : `<div class="disabled-cell">-</div>`}</td>
      <td>${row.mmse ? `<select class="score-select" data-scale="mmse" data-key="mmse_${row.no}">${scoreOptions(row.mmse, state[`mmse_${row.no}`])}</select>` : `<div class="disabled-cell">-</div>`}</td>
    </tr>
  `).join("");
  document.querySelectorAll(".score-select").forEach((select) => {
    select.addEventListener("change", () => {
      saveState();
      updateTotals();
    });
  });
  updateTotals();
}

function total(scale) {
  return [...document.querySelectorAll(`.score-select[data-scale="${scale}"]`)]
    .reduce((sum, select) => sum + (Number(select.value) || 0), 0);
}

function updateTotals() {
  $("hdsrTotal").textContent = String(total("hdsr"));
  $("mmseTotal").textContent = String(total("mmse"));
}

function sendToEvaluation() {
  const score = total("mmse");
  localStorage.setItem(EVAL_DRAFT_KEY, JSON.stringify({
    sourceLabel: "MMSE",
    recordDate: today(),
    measurements: { mmse: String(score) }
  }));
  location.href = "./record-destination.html";
}

async function createPdf() {
  if (!window.PDFLib) {
    alert("PDF生成ライブラリを読み込めませんでした。");
    return;
  }
  const hdsr = String(total("hdsr"));
  const mmse = String(total("mmse"));
  const template = await fetch(MMSE_TEMPLATE_URL).then((res) => res.arrayBuffer());
  const pdfDoc = await PDFLib.PDFDocument.load(template);
  const page = pdfDoc.getPage(0);
  const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const size = 12;
  const hdsrWidth = font.widthOfTextAtSize(hdsr, size);
  const mmseWidth = font.widthOfTextAtSize(mmse, size);
  page.drawText(hdsr, { x:474 - hdsrWidth / 2, y:28, size, font });
  page.drawText(mmse, { x:535 - mmseWidth / 2, y:28, size, font });
  const bytes = await pdfDoc.save();
  const blob = new Blob([bytes], { type:"application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `HDS-R_MMSE共通シート_${today()}.pdf`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearScores() {
  document.querySelectorAll(".score-select").forEach((select) => {
    select.value = "";
  });
  saveState();
  updateTotals();
}

$("sendRecord").addEventListener("click", sendToEvaluation);
$("createPdf").addEventListener("click", createPdf);
$("clearScores").addEventListener("click", clearScores);
renderRows();
</script>
<script src="./assessment-context.js" data-record-target="choice"></script>
</body>
</html>
