<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重心動揺解析 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #f2f2f7; --card: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #1c1c1e; }
        .card { background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 15px; box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.2rem; margin: 0 0 15px 0; text-align: center; }
        .drop-zone { border: 2px dashed #ccc; border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; }
        .drop-zone:hover { border-color: var(--primary); background: #f0f7ff; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .res-item { background: #f8f9fa; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #eee; }
        .res-label { font-size: 0.75rem; color: #666; margin-bottom: 4px; }
        .res-val { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        canvas { width: 100% !important; height: auto !important; aspect-ratio: 1; background: white; border-radius: 10px; margin-top: 15px; }
        .btn-copy { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>重心動揺解析 (Rロジック準拠)</h1>
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p id="fileNameDisplay">CSVファイルをアップロード<br><small>前後5秒を除外して解析します</small></p>
        <input type="file" id="fileInput" class="hidden" accept=".csv">
    </div>
</div>

<div id="resultArea" class="hidden">
    <div class="card">
        <div class="results-grid">
            <div class="res-item" style="grid-column: span 2;">
                <div class="res-label">95% 信頼楕円面積</div>
                <div class="res-val"><span id="area-val">-</span> <small>cm²</small></div>
            </div>
            <div class="res-item">
                <div class="res-label">平均周波数 (MF)</div>
                <div class="res-val"><span id="mf-val">-</span> <small>Hz</small></div>
            </div>
            <div class="res-item">
                <div class="res-label">相対パワー周波数 (95%)</div>
                <div class="res-val"><span id="rpf-val">-</span> <small>Hz</small></div>
            </div>
        </div>
        <canvas id="copChart"></canvas>
        <button class="btn-copy" onclick="copyResult()">結果をコピー</button>
    </div>
</div>

<script>
const fs = 100; 
const trimCount = 500; 

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => processData(ev.target.result);
    reader.readAsText(file);
});

function processData(csvText) {
    const lines = csvText.trim().split('\n');
    // ヘッダーの読み取りを強化：BOM削除、トリム、小文字化
    const headers = lines[0].replace(/^\ufeff/, '').split(',').map(h => h.trim().toLowerCase());
    
    // 列のインデックスを探す（より柔軟に探すように変更）
    const idxX = headers.findIndex(h => h.includes('copx'));
    const idxY = headers.findIndex(h => h.includes('copy'));

    if (idxX === -1 || idxY === -1) {
        alert("CSV内に 'COPx' または 'COPy' の列が見つかりません。\n現在の列名: " + headers.join(', '));
        return;
    }

    let rawX = [], rawY = [];
    for(let i=1; i<lines.length; i++) {
        const cols = lines[i].split(',');
        const valX = parseFloat(cols[idxX]);
        const valY = parseFloat(cols[idxY]);
        if(!isNaN(valX) && !isNaN(valY)) {
            rawX.push(valX);
            rawY.push(valY);
        }
    }

    // 1. 前後5秒除外
    if(rawX.length <= trimCount * 2) { 
        alert("データが短すぎます（前後5秒を除外するとデータが残りません）。"); 
        return; 
    }
    let x = rawX.slice(trimCount, -trimCount);
    let y = rawY.slice(trimCount, -trimCount);

    // 2. フィルタ処理 (10Hz Lowpass)
    x = butterworthLowPass(x, 10, fs);
    y = butterworthLowPass(y, 10, fs);

    // 3. センタリング
    const mx = math.mean(x); const my = math.mean(y);
    x = x.map(v => v - mx); y = y.map(v => v - my);

    // 4. 95%楕円面積算出 (mmからcmに変換して計算)
    const area = calc95Ellipse(x.map(v => v/10), y.map(v => v/10));
    
    // 5. 周波数解析 (MF/RPF) - placeholderではなく実計算
    const mf = (calcFrequencyStats(x, fs).mf + calcFrequencyStats(y, fs).mf) / 2;
    const rpf = (calcFrequencyStats(x, fs).rpf + calcFrequencyStats(y, fs).rpf) / 2;

    document.getElementById('area-val').innerText = area.toFixed(2);
    document.getElementById('mf-val').innerText = mf.toFixed(3);
    document.getElementById('rpf-val').innerText = rpf.toFixed(3);
    document.getElementById('resultArea').classList.remove('hidden');

    drawChart(x, y);
}

function butterworthLowPass(data, fc, fs) {
    const n = data.length;
    const out = new Array(n);
    const omega = 2.0 * Math.PI * fc / fs;
    const cosw = Math.cos(omega);
    const alpha = Math.sin(omega) / (2.0 * 0.707);
    const a0 = 1.0 + alpha;
    const a1 = -2.0 * cosw;
    const a2 = 1.0 - alpha;
    const b0 = (1.0 - cosw) / 2.0;
    const b1 = 1.0 - cosw;
    const b2 = (1.0 - cosw) / 2.0;

    out[0] = data[0]; out[1] = data[1];
    for(let i=2; i<n; i++) {
        out[i] = (b0/a0)*data[i] + (b1/a0)*data[i-1] + (b2/a0)*data[i-2] - (a1/a0)*out[i-1] - (a2/a0)*out[i-2];
    }
    return out;
}

function calc95Ellipse(x, y) {
    const cov = [[math.variance(x), math.covariance(x, y)], [math.covariance(x, y), math.variance(y)]];
    const eig = math.eigs(cov);
    const chiSquare = 5.991; 
    return Math.PI * Math.sqrt(chiSquare * eig.values[0]) * Math.sqrt(chiSquare * eig.values[1]);
}

// 実際の周波数解析（パワースペクトル密度ベース）
function calcFrequencyStats(s, fs) {
    const n = s.length;
    let psd = [];
    // 簡易FFT (実数入力のみに対応した振幅計算)
    for (let f = 0; f < n / 2; f++) {
        let re = 0, im = 0;
        for (let t = 0; t < n; t++) {
            const angle = (2 * Math.PI * f * t) / n;
            re += s[t] * Math.cos(angle);
            im -= s[t] * Math.sin(angle);
        }
        psd.push((re * re + im * im) / n);
    }
    
    // 平均周波数 (MF)
    let sumF = 0, sumP = 0;
    psd.forEach((p, i) => {
        const f = i * fs / n;
        sumF += f * p;
        sumP += p;
    });
    const mf = sumF / sumP;

    // 相対パワー周波数 (RPF 95%)
    let cumulative = 0;
    const totalPower = sumP;
    let rpf = 0;
    for (let i = 0; i < psd.length; i++) {
        cumulative += psd[i];
        if (cumulative >= 0.95 * totalPower) {
            rpf = i * fs / n;
            break;
        }
    }

    return { mf, rpf };
}

let chart;
function drawChart(x, y) {
    const ctx = document.getElementById('copChart').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: 'COP (cm)',
                data: x.map((v, i) => ({x: v/10, y: y[i]/10})),
                borderColor: 'rgba(0, 122, 255, 0.5)',
                showLine: true, pointRadius: 0, borderWidth: 1
            }]
        },
        options: { 
            aspectRatio: 1, 
            scales: { 
                x: {title:{display:true, text:'ML (cm)'}}, 
                y: {title:{display:true, text:'AP (cm)'}} 
            } 
        }
    });
}

function copyResult() {
    const area = document.getElementById('area-val').innerText;
    const mf = document.getElementById('mf-val').innerText;
    const rpf = document.getElementById('rpf-val').innerText;
    const txt = `【重心動揺結果】\n95%楕円面積: ${area} cm²\n平均周波数: ${mf} Hz\n相対パワー周波数: ${rpf} Hz`;
    navigator.clipboard.writeText(txt).then(() => alert("コピーしました"));
}
</script>
</body>
</html>
