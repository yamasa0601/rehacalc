<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COP解析</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>COP解析</h1>

    <div class="box">
      <div class="row">
        <input id="file" type="file" accept=".csv" />
        <button id="run" class="btn" disabled>解析</button>
      </div>

      <div class="row">
        <label>FS(Hz) <input id="fs" type="number" value="100" step="1" /></label>
        <label>LPF(Hz) <input id="cutoff" type="number" value="10" step="0.5" /></label>
        <label>前後除外(秒) <input id="trimSec" type="number" value="5" step="0.5" /></label>
        <label><input id="autoTrim" type="checkbox" checked /> 自動調整</label>
        <label><input id="resample" type="checkbox" checked /> 等間隔リサンプル</label>
        <label>入力単位
          <select id="unit">
            <option value="mm" selected>mm</option>
            <option value="cm">cm</option>
          </select>
        </label>
        <label>出力単位
          <select id="unitOut">
            <option value="cm" selected>cm</option>
            <option value="mm">mm</option>
          </select>
        </label>
      </div>
    </div>

    <div id="msg"></div>
    <div id="metrics"></div>
    <div id="details"></div>

    <div class="row">
      <button id="dlMetrics" class="btn" disabled>指標CSVを保存</button>
      <button id="dlBands" class="btn" disabled>帯域CSVを保存</button>
      <button id="dlPng" class="btn" disabled>PNGを保存</button>
    </div>

    <div class="plots">
      <div id="plotCop"></div>
      <div id="plotBands"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"></script>
    <script src="./copanalyze.js"></script>
  </body>
</html>
