<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMA Pro - 上肢・下肢評価</title>
    <style>
        :root { --primary: #007AFF; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #8e8e93; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 280px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; position: sticky; top: 10px; z-index: 100; }
        .tab { flex: 1; padding: 12px; background: #ddd; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .tab.active { background: var(--primary); color: white; }
        .section-card { background: var(--card); border-radius: 14px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h2 { font-size: 0.9rem; border-left: 4px solid var(--primary); padding-left: 8px; color: var(--primary); margin: 0 0 10px 0; }
        .note { font-size: 0.72rem; color: var(--muted); margin-bottom: 10px; line-height: 1.5; padding: 6px 8px; background: #f8f8fa; border-radius: 8px; }
        .sub-label { font-size: 0.78rem; font-weight: 600; color: var(--primary); margin: 10px 0 4px; padding-left: 4px; }
        .item { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .item:last-child { border-bottom: none; margin-bottom: 0; }
        .item-name { font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; display: block; line-height: 1.3; }
        .item-name .joint { font-size: 0.72rem; color: var(--muted); font-weight: normal; }
        .item-name .posture { font-size: 0.68rem; color: #888; font-weight: normal; display: block; margin-top: 2px; }
        .options { display: flex; gap: 4px; }
        .options label { flex: 1; text-align: center; background: #f0f0f0; padding: 10px 4px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
        .options input { display: none; }
        .options input:checked + span { background: var(--primary); color: white; display: block; border-radius: 8px; padding: 10px 4px; margin: -10px -4px; }
        .options input[value="0"]:checked + span { background: #ff3b30; }
        .options input[value="1"]:checked + span { background: #ff9500; }
        .options input[value="2"]:checked + span { background: #34c759; }
        .scale-hint { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
        .memo-row { margin-top: 4px; }
        .memo-input { width: 100%; padding: 6px 8px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 0.75rem; color: var(--text); background: #fafafa; }
        .memo-input:focus { outline: none; border-color: var(--primary); background: #fff; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); padding: 10px 15px; border-top: 1px solid #ddd; z-index: 1000; }
        .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 6px; }
        .score-box { background: #f1f3f5; padding: 5px; border-radius: 10px; text-align: center; }
        .score-box.highlight { background: #e3f0ff; }
        .score-val { font-size: 1.05rem; font-weight: bold; color: var(--primary); display: block; }
        .score-label { font-size: 0.55rem; color: var(--muted); font-weight: bold; }
        .sev-bar { padding: 5px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 0.82rem; margin-bottom: 6px; }
        .hidden { display: none; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-action { flex: 1; min-width: 120px; padding: 11px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-copy { background: var(--primary); color: white; }
        .btn-csv { background: #34c759; color: white; }
        .btn-record { background: #0f766e; color: white; }
    </style>
</head>
<body>

<div class="tabs">
    <button id="tab-ue" class="tab active" onclick="switchTab('ue')">上肢 (UE)</button>
    <button id="tab-le" class="tab" onclick="switchTab('le')">下肢 (LE)</button>
</div>

<!-- ==================== UE ==================== -->
<div id="content-ue"></div>

<!-- ==================== LE ==================== -->
<div id="content-le" class="hidden"></div>

<!-- ==================== Footer ==================== -->
<div class="footer">
    <div id="footer-ue">
        <div class="score-grid">
            <div class="score-box"><span class="score-label">A. 肩/肘/前腕</span><span id="ue-scoreA" class="score-val">0/36</span></div>
            <div class="score-box"><span class="score-label">B. 手関節</span><span id="ue-scoreB" class="score-val">0/10</span></div>
            <div class="score-box"><span class="score-label">C. 手指</span><span id="ue-scoreC" class="score-val">0/14</span></div>
        </div>
        <div class="score-grid">
            <div class="score-box"><span class="score-label">D. 協調性</span><span id="ue-scoreD" class="score-val">0/6</span></div>
            <div class="score-box highlight"><span class="score-label">運動合計</span><span id="ue-motor" class="score-val" style="font-size:1.2rem">0/66</span></div>
            <div class="score-box"><span class="score-label">H. 感覚</span><span id="ue-scoreH" class="score-val">0/12</span></div>
        </div>
        <div class="score-grid">
            <div class="score-box"><span class="score-label">I. 可動域</span><span id="ue-scoreI" class="score-val">0/20</span></div>
            <div class="score-box"><span class="score-label">J. 関節痛</span><span id="ue-scoreJ" class="score-val">0/20</span></div>
            <div class="score-box"><span id="ue-sev-bar" class="sev-bar" style="margin:0;padding:8px 5px">判定中</span></div>
        </div>
    </div>
    <div id="footer-le" class="hidden">
        <div class="score-grid">
            <div class="score-box"><span class="score-label">E. 股/膝/足</span><span id="le-scoreE" class="score-val">0/28</span></div>
            <div class="score-box"><span class="score-label">F. 協調性</span><span id="le-scoreF" class="score-val">0/6</span></div>
            <div class="score-box highlight"><span class="score-label">運動合計</span><span id="le-motor" class="score-val" style="font-size:1.2rem">0/34</span></div>
        </div>
        <div class="score-grid">
            <div class="score-box"><span class="score-label">H. 感覚</span><span id="le-scoreH" class="score-val">0/12</span></div>
            <div class="score-box"><span class="score-label">I. 可動域</span><span id="le-scoreI" class="score-val">0/20</span></div>
            <div class="score-box"><span class="score-label">J. 関節痛</span><span id="le-scoreJ" class="score-val">0/20</span></div>
        </div>
        <div id="le-sev-bar" class="sev-bar">判定中...</div>
    </div>
    <div class="btn-row">
        <button class="btn-action btn-copy" onclick="copyResult()">結果をコピー</button>
        <button class="btn-action btn-csv" onclick="exportCSV()">CSV出力</button>
        <button class="btn-action btn-record" onclick="sendToEvaluation()">脳卒中評価記録へ送る</button>
    </div>
</div>

/* ================================================================
   RENDERING
   ================================================================ */
let currentTab = 'ue';

function renderItem(item) {
    const opts = item.opts || [0,1,2];
    let h = '<div class="item">';
    h += `<span class="item-name">${item.n}`;
    if (item.sub) h += ` <span class="joint">${item.sub}</span>`;
    if (item.posture) h += `<span class="posture">${item.posture}</span>`;
    h += '</span>';
    h += '<div class="options">';
    opts.forEach(v => { h += `<label><input type="radio" name="${item.id}" value="${v}" onchange="calc()"><span>${v}</span></label>`; });
    h += '</div>';
    if (item.hint) h += `<div class="scale-hint">${item.hint}</div>`;
    h += `<div class="memo-row"><input type="text" class="memo-input" placeholder="注意点" data-memo="${item.id}"></div>`;
    h += '</div>';
    return h;
}

function renderItems(items) { return items.map(renderItem).join(''); }

function card(title, noteText, content) {
    return `<div class="section-card"><h2>${title}</h2>${noteText ? '<div class="note">'+noteText+'</div>' : ''}${content}</div>`;
}

function subLabel(text) { return `<div class="sub-label">${text}</div>`; }

function renderUE() {
    let html = '';

    /* A-I. 反射 */
    html += card('A-I. 反射（4点）',
        '前腕回外位で手は大腿の上に置く / 腱反射が減弱でも非麻痺側と同等であれば2点',
        renderItems(ueReflex));

    /* A-II. 共同運動 */
    html += card('A-II. 共同運動（18点）',
        '各要素を別々で評価せず、一つの動きとして評価する / 各要素は運動の最終時点で評価し、運動途中で個別に採点してはならない / 可動域制限がある場合はその範囲内の動きで評価 / 体幹の側屈・回旋に注意',
        subLabel('a) 屈曲共同運動「麻痺側の耳まで手をもってくる」') +
        renderItems(ueSynergyA) +
        subLabel('b) 伸展共同運動「非麻痺側の膝に手をもっていく」') +
        renderItems(ueSynergyB));

    /* A-III. 混合動作 */
    html += card('A-III. 共同運動の混合動作（6点）',
        'a) 直立肢位保持のための徒手的誘導は可能 / 体幹・胸郭の回旋代償が入ればASISを超えても0点<br>' +
        'b) 開始肢位のための介助は可能 / 肩外転や肘屈曲の代償が途中から出現すれば1点、開始初期から出現すれば0点<br>' +
        'c) 肘は体にくっつける / 介助不可',
        renderItems(ueMixed));

    /* A-IV. 分離動作 */

}

/* ================================================================
   SCORE CALCULATION
   ================================================================ */
function sumGroup(arrays) {
    let t = 0;
    arrays.forEach(arr => arr.forEach(item => {
        const el = document.querySelector(`input[name="${item.id}"]:checked`);
        if (el) t += parseInt(el.value, 10);
    }));
    return t;
}

function calc() {
    if (currentTab === 'ue') {
        const sA = sumGroup(ueSectionMap.a);
        const sB = sumGroup(ueSectionMap.b);
        const sC = sumGroup(ueSectionMap.c);
        const sD = sumGroup(ueSectionMap.d);
        const sH = sumGroup(ueSectionMap.h);
        const sI = sumGroup(ueSectionMap.i);
        const sJ = sumGroup(ueSectionMap.j);
        const motor = sA + sB + sC + sD;

        document.getElementById('ue-scoreA').innerText = sA + "/36";
        document.getElementById('ue-scoreB').innerText = sB + "/10";
        document.getElementById('ue-scoreC').innerText = sC + "/14";
        document.getElementById('ue-scoreD').innerText = sD + "/6";
        document.getElementById('ue-motor').innerText = motor + "/66";
        document.getElementById('ue-scoreH').innerText = sH + "/12";
        document.getElementById('ue-scoreI').innerText = sI + "/20";
        document.getElementById('ue-scoreJ').innerText = sJ + "/20";
        setSev('ue-sev-bar', motor, 43, 29);
    } else {
        const sE = sumGroup(leSectionMap.e);
        const sF = sumGroup(leSectionMap.f);
        const sH = sumGroup(leSectionMap.h);
        const sI = sumGroup(leSectionMap.i);
        const sJ = sumGroup(leSectionMap.j);
        const motor = sE + sF;

        document.getElementById('le-scoreE').innerText = sE + "/28";
        document.getElementById('le-scoreF').innerText = sF + "/6";
        document.getElementById('le-motor').innerText = motor + "/34";
        document.getElementById('le-scoreH').innerText = sH + "/12";
        document.getElementById('le-scoreI').innerText = sI + "/20";
        document.getElementById('le-scoreJ').innerText = sJ + "/20";
        setSev('le-sev-bar', motor, 28, 19);
    }
}

function setSev(id, s, light, mod) {
    const el = document.getElementById(id);
    if (s >= light) { el.innerText = "軽度麻痺"; el.style.background = "#e1f5fe"; }
    else if (s >= mod) { el.innerText = "中等度麻痺"; el.style.background = "#fff9c4"; }
    else { el.innerText = "重度麻痺"; el.style.background = "#ffccbc"; }
}

/* ================================================================
   TAB SWITCHING
   ================================================================ */
function switchTab(t) {
    currentTab = t;
    document.getElementById('tab-ue').className = t === 'ue' ? 'tab active' : 'tab';
    document.getElementById('tab-le').className = t === 'le' ? 'tab active' : 'tab';
    document.getElementById('content-ue').className = t === 'ue' ? '' : 'hidden';
    document.getElementById('content-le').className = t === 'le' ? '' : 'hidden';
    document.getElementById('footer-ue').className = t === 'ue' ? '' : 'hidden';
    document.getElementById('footer-le').className = t === 'le' ? '' : 'hidden';
    calc();
}

function motorScore(id) {
    return document.getElementById(id).innerText.split('/')[0];
}

function sendToEvaluation() {
    const measurements = {};
    if (document.querySelector('#content-ue input[type="radio"]:checked')) {
        measurements.fmaUpper = motorScore('ue-motor');
    }
    if (document.querySelector('#content-le input[type="radio"]:checked')) {
        measurements.fmaLower = motorScore('le-motor');
    }
    if (Object.keys(measurements).length === 0) {
        alert("上肢または下肢を入力してください。");
        return;
    }
    localStorage.setItem(EVAL_DRAFT_KEY, JSON.stringify({
        sourceLabel: "FMA",
        recordDate: new Date().toISOString().slice(0, 10),
        measurements
    }));
    location.href = "./stroke-record.html";
}

function exportCSV() {
    const rows = [["セクション", "項目", "スコア", "注意点"]];
    const add = (sec, items) => items.forEach(item => {
        const el = document.querySelector(`input[name="${item.id}"]:checked`);
        const memo = document.querySelector(`input[data-memo="${item.id}"]`);
        rows.push([sec, item.n, el ? el.value : "", memo ? memo.value : ""]);
    });

    if (currentTab === 'ue') {
        add("A-I.反射", ueReflex);
        add("A-II.屈曲共同運動", ueSynergyA);
        add("A-II.伸展共同運動", ueSynergyB);
        add("A-III.混合動作", ueMixed);
        add("A-IV.分離動作", ueIsolated);
        add("A-V.正常反射", ueNormalReflex);
        add("B.手関節", ueWrist);
        add("C.手指", ueHand);
        add("D.協調性", ueCoord);
        add("H.感覚", ueSens);
        add("I.可動域", ueRom);
        add("J.関節痛", uePain);
        rows.push(["合計","A.肩/肘/前腕", document.getElementById('ue-scoreA').innerText, ""]);
        rows.push(["合計","B.手関節", document.getElementById('ue-scoreB').innerText, ""]);
        rows.push(["合計","C.手指", document.getElementById('ue-scoreC').innerText, ""]);
        rows.push(["合計","D.協調性", document.getElementById('ue-scoreD').innerText, ""]);
        rows.push(["合計","運動合計", document.getElementById('ue-motor').innerText, ""]);
        rows.push(["合計","H.感覚", document.getElementById('ue-scoreH').innerText, ""]);
        rows.push(["合計","I.可動域", document.getElementById('ue-scoreI').innerText, ""]);
        rows.push(["合計","J.関節痛", document.getElementById('ue-scoreJ').innerText, ""]);
    } else {
        add("E-I.反射", leReflex);
        add("E-II.屈曲共同運動", leSynergyA);
        add("E-II.伸展共同運動", leSynergyB);
        add("E-III.座位", leSit);
        add("E-IV.立位", leStand);
        add("E-V.正常反射", leNormalReflex);
        add("F.協調性", leCoord);
        add("H.感覚", leSens);
        add("I.可動域", leRom);
        add("J.関節痛", lePain);
        rows.push(["合計","E.股/膝/足", document.getElementById('le-scoreE').innerText, ""]);
        rows.push(["合計","F.協調性", document.getElementById('le-scoreF').innerText, ""]);
        rows.push(["合計","運動合計", document.getElementById('le-motor').innerText, ""]);
        rows.push(["合計","H.感覚", document.getElementById('le-scoreH').innerText, ""]);
        rows.push(["合計","I.可動域", document.getElementById('le-scoreI').innerText, ""]);
        rows.push(["合計","J.関節痛", document.getElementById('le-scoreJ').innerText, ""]);
    }

    const bom = '\uFEFF';
    const csv = bom + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `FMA_${currentTab.toUpperCase()}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}
